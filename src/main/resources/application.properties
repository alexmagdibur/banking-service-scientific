spring.application.name=bankig-service-scientific

# PostgreSQL: the connection is configured only through environment variables (see .env.example).
# There is deliberately no default password.
spring.datasource.url=${BANK_DB_URL:jdbc:postgresql://localhost:5432/bank_test}
spring.datasource.username=${BANK_DB_USER:bank}
spring.datasource.password=${BANK_DB_PASSWORD:}

# The schema and the test accounts are created only by Flyway migrations (src/main/resources/db/migration).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Money must never be silently truncated: a fractional amountMinor (e.g. 1.5) is rejected with 400.
spring.jackson.deserialization.accept-float-as-int=false

# Waiting for a pooled connection (also used by the readiness DB check) is bounded, so that probes
# and requests fail fast when PostgreSQL is unreachable instead of hanging for Hikari's default 30 s.
spring.datasource.hikari.connection-timeout=${BANK_DB_CONNECTION_TIMEOUT_MS:3000}

# Instance identity: Pod name in Kubernetes (HOSTNAME), computer name on Windows; INSTANCE_ID overrides both.
bank.instance-id=${INSTANCE_ID:${HOSTNAME:${COMPUTERNAME:unknown}}}

# Actuator: the user API is on server.port (8080); the management port (8081) is internal and carries
# /actuator/** (metrics and the research endpoint are added in later stages). Kubernetes probes use the
# main port: /livez and /readyz are exposed there through add-additional-paths.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
# Liveness = the process itself; it must never depend on PostgreSQL (a DB outage must not restart Pods).
management.endpoint.health.group.liveness.include=livenessState
# Readiness = this instance can serve the API, which needs PostgreSQL: with the DB down every user
# operation fails, so the Pod is taken out of the Service endpoints (not restarted) until the DB returns.
management.endpoint.health.group.readiness.include=readinessState,db

# Metrics: /actuator/prometheus is served on the management port only (never on server.port).
# Business metrics (bank.operations) have exactly two labels, operation and outcome - never account,
# transfer or idempotency-key identifiers. http.server.requests uses URI templates (/api/accounts/{id}).
management.metrics.tags.application=bank-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logs go to stdout: UTC time, level, instance id, logger, message. Operation lines
# (logger bank.operations) carry op, outcome, status and duration_ms and never an idempotency key;
# set LOGGING_LEVEL_BANK_OPERATIONS=WARN to silence them during heavy load runs.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %5p [${bank.instance-id}] %logger{36} : %m%n%wEx
logging.level.bank.operations=${LOGGING_LEVEL_BANK_OPERATIONS:INFO}
