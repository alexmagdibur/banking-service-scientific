# TEST credentials of the isolated research stand (fictional data, no real money or personal data).
# Change them before exposing the cluster beyond your own LAN, or replace the Secret without editing Git:
#   kubectl -n bank create secret generic bank-db --from-literal=username=bank --from-literal=password='<new>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# (the PostgreSQL password is fixed on the first start of an empty volume; to change it later, recreate the volume.)
apiVersion: v1
kind: Secret
metadata:
  name: bank-db
type: Opaque
stringData:
  username: bank
  password: bank-test-password
