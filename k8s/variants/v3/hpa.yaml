apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-api
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
