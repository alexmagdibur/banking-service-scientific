# Profile "test" is activated by the integration tests. They use a dedicated test database:
# BANK_TEST_DB_* if set, otherwise BANK_DB_*. AbstractIntegrationTest refuses to run unless the
# database name ends with "_test", because the tests wipe the transfers table and reset balances.
spring.datasource.url=${BANK_TEST_DB_URL:${BANK_DB_URL:jdbc:postgresql://localhost:5432/bank_test}}
spring.datasource.username=${BANK_TEST_DB_USER:${BANK_DB_USER:bank}}
spring.datasource.password=${BANK_TEST_DB_PASSWORD:${BANK_DB_PASSWORD:}}
