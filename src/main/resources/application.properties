spring.application.name=bankig-service-scientific

# PostgreSQL: the connection is configured only through environment variables (see .env.example).
# There is deliberately no default password.
spring.datasource.url=${BANK_DB_URL:jdbc:postgresql://localhost:5432/bank_test}
spring.datasource.username=${BANK_DB_USER:bank}
spring.datasource.password=${BANK_DB_PASSWORD:}

# The schema and the test accounts are created only by Flyway migrations (src/main/resources/db/migration).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
