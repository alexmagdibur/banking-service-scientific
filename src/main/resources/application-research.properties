# Profile "research" (spring.profiles.active=research): adds the internal fault-injection endpoint
# POST /actuator/researchfault on the management port and makes probes fail while it is active.
# It is never active by default; do not enable it in the Service exposed to users.
management.endpoints.web.exposure.include=health,prometheus,researchfault
management.endpoint.health.group.liveness.include=livenessState,researchFault
management.endpoint.health.group.readiness.include=readinessState,db,researchFault
